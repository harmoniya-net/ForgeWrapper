name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # to dispatch the document workflow once the release exists
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8.0.312"
          architecture: x64
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -iS
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A launcher pins this jar by URL + sha1, so the checksums are part of
          # what the release publishes — not a nicety.
          {
            echo '```'
            sha1sum build/libs/*.jar | sed 's|build/libs/||'
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            build/libs/*
      - name: Regenerate the version documents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The documents name this release by URL and sha1, so they are stale the
        # moment it is published. A dispatch is the one cross-workflow trigger
        # GITHUB_TOKEN is allowed to fire.
        #
        # On the default branch, not on the tag: the github-pages environment
        # only accepts deployments from a protected branch, so a tag-ref run
        # generates the documents and is then refused at the deploy step. The
        # generator reads the release it should name from the API anyway
        # (`gh release view`), so the ref it runs on carries no information.
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
