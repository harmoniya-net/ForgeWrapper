import java.text.SimpleDateFormat

plugins {
    id "java"
    id "eclipse"
}

sourceCompatibility = targetCompatibility = 1.8
compileJava {
    sourceCompatibility = targetCompatibility = 1.8
}

version = "${-> resolveVersion()}"
group = "io.github.zekerzhayard"
archivesBaseName = rootProject.name

configurations {
    multirelase {
        implementation.extendsFrom multirelase
    }
}

repositories {
    mavenCentral()
    maven {
        name = "forge"
        url = "https://maven.minecraftforge.net/"
    }
}

dependencies {
    compileOnly "com.google.code.gson:gson:2.8.7"
    compileOnly "cpw.mods:modlauncher:8.0.9"
    compileOnly "net.minecraftforge:installer:2.2.7"
    compileOnly "net.sf.jopt-simple:jopt-simple:5.0.4"

    multirelase project(":jigsaw")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

jar {
    manifest.attributes([
        "Specification-Title": "${project.name}",
        "Specification-Vendor": "ZekerZhayard",
        "Specification-Version": "${project.version}".split("-")[0],
        "Implementation-Title": "${project.name}",
        "Implementation-Version": "${project.version}",
        "Implementation-Vendor" :"ZekerZhayard",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        "Automatic-Module-Name": "${project.group}.${project.archivesBaseName}".toString().toLowerCase(),
        "Multi-Release": "true",
        "GitCommit": String.valueOf(System.getenv("GITHUB_SHA"))
    ])

    into "META-INF/versions/9", {
        from configurations.multirelase.files.collect {
            zipTree(it)
        }
        exclude "META-INF/**"
    }
}

// The jar is pinned by URL + sha1 from a release asset, so the version has to
// be the tag that produced it — a date suffix would name a build no tag points
// at. Off a tag, the date suffix still keeps CI builds distinguishable.
String resolveVersion() {
    if (System.getenv("GITHUB_REF_TYPE") == "tag") {
        String tag = System.getenv("GITHUB_REF_NAME")
        if (tag != null && !tag.isEmpty()) return tag
    }

    if (System.getenv("GITHUB_ACTIONS") == "true")
        return "${fw_version}" + new SimpleDateFormat("-yyyy-MM-dd").format(new Date())

    return "${fw_version}-LOCAL"
}
